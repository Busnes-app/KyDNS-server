name: Release

# Separate from ci.yml so the write permissions a release needs never apply to
# a pull request build.
#
# A pushed tag vX.Y.Z publishes that release. dependency-release.yml publishes
# vX.Y.Z.N, but a tag it creates with GITHUB_TOKEN raises no push event, so it
# dispatches this workflow on the new tag with publish set. Any other manual
# run is a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release for the tag this runs on (it must have none yet). Off: a dry run."
        type: boolean
        default: false

permissions:
  contents: read

# Two runs against the same tag would race on `gh release create`.
# cancel-in-progress is false, unlike ci.yml: cancelling a half-finished
# publish could leave a release with a partial asset set.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    permissions:
      contents: write     # create the release
      id-token: write     # keyless attestation
      attestations: write
    steps:
      # gh publishes with GH_TOKEN; nothing here pushes with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Debian versions must start with a digit, so the tag's leading v goes.
      # A manual run is not a release unless publish is set; without it, it just
      # proves the workflow still works.
      - name: resolve the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-dev+${GITHUB_SHA:0:7}
          fi
          # A ref name may hold ;, $, backticks, and pipes. This value ends up
          # in a make recipe, a file name, and a Debian version field, so
          # anything outside that alphabet is rejected here rather than
          # escaped at each of the places it lands.
          case $version in
            *[!0-9A-Za-z.+~_-]* | '')
              echo "refusing to build from tag '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # ref_type alone isn't enough: workflow_dispatch can be run against an
          # existing tag ref, which would satisfy that check and publish a real
          # release from what an operator thought was a dry run. A dispatch
          # publishes only when asked, only from a release tag, and only a tag
          # with no release yet, so it can never replace published assets.
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
          elif [ "$PUBLISH" = true ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] ||
              [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[1-9][0-9]*)?$ ]]; then
              echo "::error::publish needs a vX.Y.Z or vX.Y.Z.N tag, got $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"; exit 1
            fi
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::$GITHUB_REF_NAME already has a release"; exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # An attestation only says where an artifact came from. Publishing one
      # for a tag that was never tested lets that signature vouch for code no
      # check ever saw.
      - name: tests pass
        run: go test ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: install browser dependencies
        working-directory: browser
        timeout-minutes: 20
        run: |
          npm ci
          npm audit --audit-level=low
          npx playwright install --with-deps chromium
      - name: browser regressions
        working-directory: browser
        timeout-minutes: 10
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: browser/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: backup and restore proofs
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3
          scripts/restore-drill.sh
          scripts/backup-live-proof.sh

      # The version reaches these steps through the environment, never spliced
      # into the script body: it comes from a tag name, and a ref may contain
      # ;, $, backticks, and pipes, in a job that holds contents: write.
      - name: build binaries and packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make package VERSION="$VERSION"

      # The image is Raspberry Pi OS Lite arm64 with the tested arm64 package
      # staged for installation on its first networked boot. Mounting a loop
      # device needs root; the builder cleans it up on exit.
      - name: build Raspberry Pi SD image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo ./scripts/build-rpi-image.sh \
            "dist/kydns_${VERSION}_arm64.deb" \
            "dist/kydns_${VERSION}_rpi64.img"
          xz -T0 -9 "dist/kydns_${VERSION}_rpi64.img"

      - name: manifests are right
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          ./scripts/verify-package.sh "dist/kydns_${VERSION}_amd64.deb" amd64
          ./scripts/verify-package.sh "dist/kydns_${VERSION}_arm64.deb" arm64
          # rpm forbids "-" in a version, so nfpm rewrites it to "~" and the
          # file name follows.
          rpmversion=${VERSION//-/\~}
          ./scripts/verify-package.sh "dist/kydns-${rpmversion}-1.x86_64.rpm" amd64
          ./scripts/verify-package.sh "dist/kydns-${rpmversion}-1.aarch64.rpm" arm64

      # Before the attestation, and attested itself: SHA256SUMS is the file a
      # scripted installer is most likely to fetch.
      - name: checksums
        run: |
          set -eux
          cd dist
          sha256sum -- *.tar.gz *.deb *.rpm *.img.xz > SHA256SUMS
          cat SHA256SUMS

      # Keyless, free, and verifiable with `gh attestation verify`. Signing
      # from the first release is far cheaper than retrofitting it once people
      # are already downloading unsigned binaries.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz, dist/*.deb, dist/*.rpm, dist/*.img.xz, dist/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kydns-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.img.xz
            dist/SHA256SUMS

      # Decided in "resolve the version": a tag push, or a dispatch asked to.
      - name: publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.img.xz dist/SHA256SUMS

  # Split out so packages: write never sits on the job that runs a build
  # script as root, and gated on it so an image is only published for code
  # that job's `go test ./...` already passed.
  image:
    needs: release
    # Same guard as publishing the release: a dry run pushes no image.
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # keyless attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Derived, not spelled out: a hardcoded owner silently stopped being
      # writable when the repository moved accounts, and GITHUB_TOKEN can only
      # write the owning account's namespace. Lowercased because registries
      # reject a mixed-case repository name and the owner login is mixed case.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # VERSION is what the web UI prints under the copyright, so it has to be
      # the release and not the commit ci.yml stamps. Both the tag as written
      # and the bare version are pushed; :latest is left to ci.yml, where it
      # keeps meaning tip of main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}

      # The packages in the release are attested; an image people docker pull
      # is no less worth vouching for.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
