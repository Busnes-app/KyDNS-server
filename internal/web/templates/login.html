{{define "body"}}
<main class="ky-auth">
  <div class="ky-auth-theme"><select class="theme-selector" aria-label="Color theme" data-theme-shortcut></select></div>
  <div class="ky-auth-body">
    <div class="ky-auth-brand">
      <img class="app-mark" src="/static/app-icon.png" width="56" height="56" alt="">
      <h1>KyDNS</h1>
      <p>Names and blocking for your home network.</p>
    </div>
    <div class="ky-auth-card">
      {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
      <form method="post" action="/login">
        <div class="ky-auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        </div>
        <p class="ky-auth-check"></p>
        <button class="ky-auth-submit" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>Sign in</button>
      </form>
      {{if .SSOEnabled}}
      <hr class="ky-auth-divider">
      <a class="ky-auth-sso" href="/auth/sso/login"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="3.5"/><path d="m10 13 9-9M16 7l2 2M14 9l2 2"/></svg>Continue with Single Sign On</a>
      {{end}}
    </div>
  </div>
</main>
{{end}}
