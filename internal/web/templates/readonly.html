{{define "body"}}
<main class="ky-auth">
  <div class="ky-auth-theme"></div>
  <div class="ky-auth-body">
    <div class="ky-auth-brand">
      <img class="app-mark" src="/static/app-icon.png" width="56" height="56" alt="">
      <h1>KyDNS</h1>
    </div>
    <div class="ky-auth-card">
      <h2>This node is a read-only replica</h2>
      <p>Nothing was changed here. A replica follows <code>{{.ManagedBy}}</code>, which
         would overwrite this edit on its next sync.</p>
      <p>Make the change on <code>{{.ManagedBy}}</code>, or promote this node first.</p>
      <a class="ky-auth-link" href="/">Back to the dashboard</a>
    </div>
  </div>
</main>
{{end}}
