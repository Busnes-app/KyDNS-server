{{define "body"}}
<div class="auth">
<div class="brand">{{template "mark"}}<h1>KyDNS</h1></div>
<div class="centered card">
  <h2>Set up KyDNS</h2>
  <p class="muted">The setup token is in the <code>setup-token</code> file in the KyDNS data directory (<code>sudo cat /var/lib/kydns/setup-token</code> on a package install). A container also prints it to its log.</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <form class="stack" method="post" action="/setup">
    <label for="token">Setup token</label>
    <input id="token" name="token" type="text" autofocus>
    <label for="password">New password (12 characters or more)</label>
    <input id="password" name="password" type="password" autocomplete="new-password">
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password">
    <button type="submit">Create admin account</button>
  </form>
</div>
</div>
{{end}}
